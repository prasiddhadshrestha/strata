[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "strata-exam"
version = "0.1.0"
description = "Declarative assessment compiler for print-ready PDFs, offline timed runners, and mastery-streak triage."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
  { name = "Prasiddha Das Shrestha" }
]
keywords = ["education", "assessment", "pdf", "reportlab", "pymupdf", "exam", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "matplotlib>=3.9.0",
  "pillow>=10.4.0",
  "pydantic>=2.7.0",
  "pymupdf>=1.24.0",
  "pyyaml>=6.0.1",
  "reportlab>=4.2.0",
  "typer>=0.12.0",
]

[project.scripts]
strata = "strata.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/strata"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
